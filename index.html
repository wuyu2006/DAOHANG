async function fetchDeepSeekBalance(profile, el){
  if (!el) return;
  const base = (profile.base || "https://api.deepseek.com").replace(/\/+$/, "");
  try {
    const res = await fetch(base + "/user/balance", {
      headers: { "Authorization": "Bearer " + profile.key }
    });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const info = (data.balance_infos || [])[0];
    if (info) {
      el.textContent = info.currency + " " + (info.total_balance || "0");
      el.classList.add("ok");
    } else {
      el.textContent = "余额未知";
    }
  } catch(e) {
    el.textContent = "查询失败";
    el.classList.add("err");
  }
}
function refreshAllBalances(){
  state.apis.forEach(p => {
    if (p.local || !/deepseek/i.test(p.name) || !p.key) return;
    const el = document.querySelector('.balance-chip[data-api-id="' + p.id + '"]');
    if (el) fetchDeepSeekBalance(p, el);
  });
}
async function sendChat(){
  if (chatBusy) return;
  const a = activeApi();
  if (!a) { toast("请先在设置中配置 AI 模型", "warn", "robot"); openSettings("ai"); return; }
  if (!a.key && !a.local) { toast("该服务商缺少 API Key，请先填写", "warn", "key"); openSettings("ai"); return; }
  const inp = $("#chatInput");
  const text = inp.value.trim();
  if (!text) return;
  /* 开发者模式：发送精确密码解锁全部装扮 */
  if (text === "wuyu2006") {
    state.devMode = true;
    ["hat","face","back"].forEach(cat => {
      DRESS_ITEMS[cat].forEach(item => {
        if (!state.unlocked[cat].includes(item.id)) state.unlocked[cat].push(item.id);
      });
    });
    saveState();
    const turn = { id: uid(), user: { content: text, ts: Date.now() }, ai: { content: "开发者模式已开启，全部装扮已解锁。", ts: Date.now() } };
    state.chats.push(turn);
    if (state.chats.length > MAX_CHAT) state.chats.splice(0, state.chats.length - MAX_CHAT);
    saveState();
    inp.value = ""; autoResize(); updateChar();
    renderChat();
    toast("开发者模式已开启", "ok", "sparkle");
    return;
  }
  const turn = { id: uid(), user: { content: text, ts: Date.now() }, ai: null };
  state.chats.push(turn);
  if (state.chats.length > MAX_CHAT) state.chats.splice(0, state.chats.length - MAX_CHAT);
  saveState();
  statInc("chats");
  inp.value = ""; autoResize(); updateChar();
  renderChat();
  await callModel(turn);
}
/* AI 命令解析：从 AI 回复中提取 [command:args] 并执行 */
function parseCommands(text){
  const actions = [];
  const cleaned = text.replace(/\[([a-z_\-]+):([^\]]+)\]/gi, function(match, cmd, args){
    const parts = args.split(":").map(s => s.trim());
    const action = executeCommand(cmd.toLowerCase(), parts);
    if (action) actions.push(action);
    return "";
  }).trim();
  /* 兜底：AI 没输出括号命令但文字里提到了主题/布局名，尝试自动执行 */
  if (!actions.length) {
    THEMES.forEach(t => {
      if (new RegExp(t.name).test(cleaned) && /切换|改成|换成|主题/.test(cleaned)) {
        const a = executeCommand("set-theme", [t.name]);
        if (a) actions.push(a);
      }
    });
    LAYOUTS.forEach(l => {
      if (new RegExp(l.name).test(cleaned) && /布局|排版|切换|改成/.test(cleaned)) {
        const a = executeCommand("set-layout", [l.name]);
        if (a) actions.push(a);
      }
    });
  }
  return { text: cleaned, actions };
}
function executeCommand(cmd, parts){
  try {
    if (cmd === "add-shortcut" && parts.length >= 2) {
      const nm = parts[0], rawUrl = parts.slice(1).join(":");
      const u = normalizeUrl(rawUrl);
      if (!u) return { icon: "warning", label: "网址格式不正确：" + rawUrl };
      state.shortcuts.push({ id: uid(), name: nm, url: u, icon: iconForDomain(domainOf(u)), cw: 1, ch: 1, children: [], cur: 0 });
      saveState(); renderGrid();
      return { icon: "plus", label: "已添加快捷方式：" + nm };
    }
    if (cmd === "set-theme") {
      const key = (parts[0] || "").toLowerCase();
      let t = THEMES.find(x => x.id === key) || THEMES.find(x => x.name === parts[0]);
      if (!t) t = THEMES.find(x => x.name.includes(parts[0]) || x.id.includes(key));
      if (!t) {
        if (/dark|night|深|暗/.test(key)) t = THEMES.find(x => x.dark) || THEMES[0];
        else if (/light|白|亮/.test(key)) t = THEMES.find(x => !x.dark) || THEMES[0];
      }
      if (t) { applyTheme(t.id); return { icon: "palette", label: "已切换主题：" + t.name }; }
      return { icon: "warning", label: "未找到主题：" + parts[0] };
    }
    if (cmd === "set-layout") {
      const key = (parts[0] || "").toLowerCase();
      let l = LAYOUTS.find(x => x.id === key) || LAYOUTS.find(x => x.name === parts[0]);
      if (!l) l = LAYOUTS.find(x => x.name.includes(parts[0]) || x.id.includes(key));
      if (l) { applyLayout(l.id); return { icon: "sliders", label: "已切换布局：" + l.name }; }
      return { icon: "warning", label: "未找到布局：" + parts[0] };
    }
    if (cmd === "set-engine") {
      const key = (parts[0] || "").toLowerCase();
      let e = state.engines.find(x => x.id === key) || state.engines.find(x => x.name === parts[0]);
      if (!e) e = state.engines.find(x => x.name.includes(parts[0]));
      if (e) { state.lastEngineId = e.id; saveState(); renderEngineChip(); return { icon: "search", label: "已切换搜索引擎：" + e.name }; }
      return { icon: "warning", label: "未找到搜索引擎：" + parts[0] };
    }
    if (cmd === "search") {
      const q = parts.join(":");
      if (!q.trim()) return { icon: "warning", label: "搜索内容为空" };
      doSearch(q);
      return { icon: "search", label: "正在搜索：" + q };
    }
    if (cmd === "quick-search") {
      const q = parts.join(":");
      if (!q.trim()) return { icon: "warning", label: "搜索内容为空" };
      return { icon: "search", label: "搜索：" + q, button: "立即搜索", buttonAction: "search:" + q };
    }
    if (cmd === "open-settings") {
      openSettings(parts[0] || "appearance");
      return { icon: "gear", label: "已打开设置" };
    }
    if (cmd === "button") {
      return { icon: "external", label: parts[0] || "操作", button: parts[0] || "跳转", buttonAction: parts.slice(1).join(":") || "open-settings:ai" };
    }
    if (cmd === "set-clock") {
      state.showClock = /on|true|开|显示/i.test(parts[0] || "on");
      saveState(); updateClock();
      return { icon: "clock", label: state.showClock ? "已开启时间组件" : "已隐藏时间组件" };
    }
    if (cmd === "set-seconds") {
      state.showSeconds = /on|true|开|显示/i.test(parts[0] || "on");
      saveState(); updateClock();
      return { icon: "clock", label: state.showSeconds ? "已开启秒数显示" : "已关闭秒数显示" };
    }
    if (cmd === "set-history") {
      state.historyEnabled = /on|true|开|启用/i.test(parts[0] || "on");
      saveState(); renderHistoryDropdown();
      return { icon: "clock", label: state.historyEnabled ? "已开启搜索记录" : "已关闭搜索记录" };
    }
    if (cmd === "set-history-count") {
      const n = Math.max(1, Math.min(15, parseInt(parts[0], 10) || 5));
      state.historyCount = n;
      saveState(); renderHistoryDropdown();
      return { icon: "clock", label: "搜索记录条数设为 " + n };
    }
    if (cmd === "open-shortcut") {
      const name = parts.join(":");
      const sc = state.shortcuts.find(s => s.name.includes(name)) || state.shortcuts.find(s => s.name === name);
      if (sc) { openUrl(sc.url); return { icon: "link", label: "已打开：" + sc.name }; }
      return { icon: "warning", label: "未找到快捷方式：" + name };
    }
    if (cmd === "open-url") {
      const u = normalizeUrl(parts.join(":"));
      if (u) { openUrl(u); return { icon: "link", label: "已打开：" + u }; }
      return { icon: "warning", label: "网址无效" };
    }
    /* 未知命令：返回错误提示而不是静默失败 */
    return { icon: "warning", label: "未知命令：[" + cmd + "]" };
  } catch(e){ console.warn("cmd err", cmd, e); return { icon: "warning", label: "命令执行出错：" + cmd }; }
}
async function callModel(turn){
  const a = activeApi();
  if (!a) return;
  chatBusy = true;
  $("#chatSend").classList.add("busy");
  const box = $("#chatMsgs");
  const typing = document.createElement("div");
  typing.className = "msg ai typing-wrap";
  const av = document.createElement("div");
  av.className = "m-av";
  av.appendChild(icon("robot"));
  const tb = document.createElement("div");
  tb.className = "bubble";
  tb.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  typing.appendChild(av); typing.appendChild(tb);
  box.appendChild(typing);
  box.scrollTop = box.scrollHeight;
  const messages = [{
    role: "system",
    content: "你是导航首页助手。你必须在回复的最后一行用方括号命令实际执行操作。\n\n" +
      "可用命令（必须严格按格式输出，不要加反引号或代码块）：\n" +
      "[add-shortcut:名称:网址]\n" +
      "[set-theme:主题名] 可选：奶白/浅粉/薄荷绿/薰衣草紫/桃橙/海蓝/抹茶绿/柠黄/夜紫/深灰/午夜蓝/森林绿/皇室蓝/摩卡棕/暗夜玫瑰/石板灰\n" +
      "[set-layout:布局名] 可选：标准/左对齐/顶栏/双栏/紧凑/大搜索/极简/宽屏\n" +
      "[set-engine:引擎名] 可选：百度/必应/谷歌/DuckDuckGo/搜狗/360搜索/头条搜索\n" +
      "[quick-search:搜索词]\n" +
      "[open-settings:appearance 或 search 或 data 或 ai 或 help]\n" +
      "[set-clock:on 或 off]\n" +
      "[set-seconds:on 或 off]\n" +
      "[set-history:on 或 off]\n" +
      "[set-history-count:数字1-15]\n" +
      "[open-shortcut:名称] 打开已有快捷方式\n" +
      "[open-url:网址] 打开任意网站\n\n" +
      "示例（用户说\"换成深色主题\"）：\n好的，已切换到深色主题。\n[set-theme:night]\n\n" +
      "重要：命令必须单独一行放在回复最后。不要只说\"已切换\"却不输出命令。不要用反引号包裹命令。需要用户自己操作的用[button:文字:open-settings:ai]。回复要短。"
  }].concat(chatContext());
  const controller = new AbortController();
  chatAbort = controller;
  let url = String(a.base || "").trim().replace(/\/+$/, "");
  if (!/\/chat\/completions$/.test(url)) url += "/chat/completions";
  const headers = { "Content-Type": "application/json" };
  if (a.key) headers["Authorization"] = "Bearer " + a.key;
  let acc = "";
  try {
    const res = await fetch(url, {
      method: "POST",
      headers,
      body: JSON.stringify({ model: a.model || "default", messages, stream: true, temperature: 0.7 }),
      signal: controller.signal
    });
    if (!res.ok) {
      let msg = "请求失败 (" + res.status + ")";
      if (res.status === 401) msg = "API Key 无效，请检查设置";
      else if (res.status === 403) msg = "无权限访问该模型";
      else if (res.status === 404) msg = "接口地址或模型名称不存在，请检查设置";
      else if (res.status === 429) msg = "请求过于频繁，请稍后再试";
      else { const t = await res.text().catch(() => ""); if (t) msg += "：" + t.slice(0, 120); }
      throw new Error(msg);
    }
    typing.remove();
    turn.ai = { content: "", ts: Date.now() };
    const wrap = buildMsg("ai", turn);
    box.appendChild(wrap);
    const aiTxt = wrap.querySelector(".bubble span");
    box.scrollTop = box.scrollHeight;
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const j = JSON.parse(payload);
          const delta = j.choices && j.choices[0] && j.choices[0].delta ? j.choices[0].delta.content : "";
          if (delta) {
            acc += delta;
            aiTxt.textContent = acc;
            if (box.scrollHeight - box.scrollTop - box.clientHeight < 90) box.scrollTop = box.scrollHeight;
          }
        } catch (e) { /* 忽略不完整分片 */ }
      }
    }
    turn.ai.content = acc || "(模型没有返回内容)";
  } catch (err) {
    typing.remove();
    if (err && err.name === "AbortError") {
      turn.ai = { content: "已停止生成", ts: Date.now() };
    } else {
      const isNet = /Failed to fetch|NetworkError|Load failed|网络|ERR_/i.test(err && err.message ? err.message : "");
      turn.ai = {
        content: isNet
          ? "无法连接模型服务：可能是跨域限制或网络问题。本地/局域网 Ollama 可直接使用；云端服务请确认接口地址与 API Key 后重试。"
          : (err && err.message ? err.message : "请求失败"),
        ts: Date.now()
      };
    }
  }
  /* 解析 AI 回复中的 [命令] 并执行 */
  const parsed = parseCommands(turn.ai.content || "");
  if (parsed.actions.length) {
    turn.ai.content = parsed.text;
    turn.ai.actions = parsed.actions;
  }
  renderChat();
  chatBusy = false;
  chatAbort = null;
  $("#chatSend").classList.remove("busy");
  saveState();
  /* 对话完成 5 秒后刷新余额 */
  setTimeout(refreshAllBalances, 5000);
}
function toggleChat(force){
  const p = $("#chatPanel");
  const willOpen = force !== undefined ? force : p.classList.contains("closed");
  if (willOpen) {
    p.classList.remove("closed");
    renderChat();
    updateChatHeader();
    setTimeout(() => { const i = $("#chatInput"); if (i && !IS_COARSE) i.focus(); }, 360);
  } else {
    p.classList.add("closed");
    if (chatBusy && chatAbort) { try { chatAbort.abort(); } catch (e) {} }
  }
}
function bindChat(){
  const inp = $("#chatInput");
  const p = $("#chatPanel");
  $("#fab").addEventListener("click", () => toggleChat());
  $("#chatCloseBtn").addEventListener("click", () => toggleChat(false));
  $("#chatSettingsBtn").addEventListener("click", () => openSettings("ai"));
  $("#chatSend").addEventListener("click", () => sendChat());
  $("#chatClearBtn").addEventListener("click", () => {
    if (!state.chats.length) { toast("对话已经是空的", "warn", "chat"); return; }
    confirmDialog({
      title: "清空对话", iconName: "chat", danger: true,
      message: "确定清空全部 " + state.chats.length + " 条对话记录吗？",
      confirmText: "确认清空"
    }).then(yes => {
      if (!yes) return;
      state.chats = [];
      saveState();
      selChat.clear();
      p.classList.remove("multi");
      renderChat();
      toast("对话已清空", "ok", "check");
    });
  });
  inp.addEventListener("input", () => { autoResize(); updateChar(); });
  inp.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if (IS_COARSE) return; /* 触屏：回车键正常换行 */
    if (e.ctrlKey || e.metaKey) return; /* Ctrl+Enter 换行 */
    e.preventDefault();
    sendChat();
  });
  $("#chatMultiDel").addEventListener("click", () => {
    if (!selChat.size) return;
    deleteTurns([...selChat]);
  });
  $("#chatMultiCancel").addEventListener("click", () => {
    selChat.clear();
    p.classList.remove("multi");
    renderChat();
  });
  updateChatHint();
}

/* ---------------- 手柄 / 键盘光标 ---------------- */
let gCursorId = null;
function setCursor(id, scroll){
  clearCursor();
  gCursorId = id;
  const c = cardNodes[id];
  if (c) {
    c.classList.add("gpfocus");
    if (scroll) c.scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" });
  }
}
function clearCursor(){
  if (gCursorId && cardNodes[gCursorId]) cardNodes[gCursorId].classList.remove("gpfocus");
  gCursorId = null;
}
function moveCursor(dx, dy){
  const ids = state.shortcuts.map(s => s.id);
  if (!ids.length) return;
  let idx = gCursorId ? ids.indexOf(gCursorId) : -1;
  if (idx < 0) idx = 0;
  const cols = gridCols;
  const rows = Math.max(1, Math.ceil(ids.length / cols));
  let r = Math.floor(idx / cols), c = idx % cols;
  r = clamp(r + dy, 0, rows - 1);
  c = clamp(c + dx, 0, cols - 1);
  idx = clamp(r * cols + c, 0, ids.length - 1);
  setCursor(ids[idx], true);
}
function isTypingTarget(t){
  return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA");
}
function focusSearch(){
  const inp = $("#searchInput");
  inp.focus();
  try { inp.select(); } catch (e) {}
}
function initGamepad(){
  let wasConnected = false;
  let cooldown = 0;
  let prevBtns = {};
  let modalFocusIdx = -1;
  function modalFocusables(){
    if (!modalStack.length) return [];
    return $$("button, input, textarea, select", modalStack[modalStack.length - 1].el);
  }
  function moveModalFocus(dx, dy){
    const els = modalFocusables();
    if (!els.length) return;
    const cols = 2;
    let idx = els.indexOf(document.activeElement);
    if (idx < 0) idx = modalFocusIdx >= 0 ? modalFocusIdx : 0;
    const r = Math.floor(idx / cols), c = idx % cols;
    let nr = clamp(r + dy, 0, Math.ceil(els.length / cols) - 1);
    let nc = clamp(c + dx, 0, cols - 1);
    idx = clamp(nr * cols + nc, 0, els.length - 1);
    modalFocusIdx = idx;
    els[idx].focus();
  }
  function fire(name){
    if (ctxOpen) {
      if (name === "b") hideMenu();
      if (name === "a") {
        const first = $(".ctx .ctx-item");
        if (first) first.click();
      }
      return;
    }
    if (modalStack.length) {
      if (name === "a") {
        const el = document.activeElement;
        if (el && (el.tagName === "BUTTON" || el.tagName === "INPUT" || el.tagName === "TEXTAREA")) {
          if (el.tagName === "BUTTON") el.click();
          else el.focus();
        }
      }
      if (name === "x") {
        const top = modalStack[modalStack.length - 1];
        const x = $(".m-x", top.el);
        if (x) x.click();
      }
      return;
    }
    if (name === "a") {
      if (gCursorId && cardNodes[gCursorId]) cardNodes[gCursorId].click();
      else setCursor(state.shortcuts.length ? state.shortcuts[0].id : null, true);
      return;
    }
    if (name === "start" || name === "y") { focusSearch(); return; }
    if (name === "x") { toggleChat(); return; }
    if (name === "b") { if (!$("#chatPanel").classList.contains("closed")) toggleChat(false); }
  }
  function poll(now){
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = Array.from(gps).find(g => g && g.connected);
    if (gp && !wasConnected) {
      wasConnected = true;
      toast("已连接手柄，方向键选择 · A 确认 · B 返回", "ok", "game");
    }
    if (!gp && wasConnected) { wasConnected = false; clearCursor(); requestAnimationFrame(poll); return; }
    if (!gp) { requestAnimationFrame(poll); return; }
    let dx = 0, dy = 0;
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (Math.abs(ax) > 0.5) dx = ax > 0 ? 1 : -1;
    if (Math.abs(ay) > 0.5) dy = ay > 0 ? 1 : -1;
    if (gp.buttons[14] && gp.buttons[14].pressed) dx = -1;
    if (gp.buttons[15] && gp.buttons[15].pressed) dx = 1;
    if (gp.buttons[12] && gp.buttons[12].pressed) dy = -1;
    if (gp.buttons[13] && gp.buttons[13].pressed) dy = 1;
    if ((dx || dy) && now - cooldown > 220) {
      if (modalStack.length) moveModalFocus(dx, dy);
      else moveCursor(dx, dy);
      cooldown = now;
    }
    [[0, "a"], [1, "b"], [2, "x"], [3, "y"], [9, "start"]].forEach(([idx, name]) => {
      const b = gp.buttons[idx];
      const p = b ? b.pressed : false;
      if (p && !prevBtns[idx]) fire(name);
      prevBtns[idx] = p;
    });
    requestAnimationFrame(poll);
  }
  requestAnimationFrame(poll);
}
function bindKeyboard(){
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeAllDrops(); hideMenu(); return; }
    if (e.key === "/" && !isTypingTarget(e.target)) { e.preventDefault(); focusSearch(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); focusSearch(); return; }
    if (modalStack.length || ctxOpen || isTypingTarget(e.target)) return;
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) {
      e.preventDefault();
      moveCursor(
        e.key === "ArrowLeft" ? -1 : e.key === "ArrowRight" ? 1 : 0,
        e.key === "ArrowUp" ? -1 : e.key === "ArrowDown" ? 1 : 0
      );
    }
    if (e.key === "Enter" && gCursorId) {
      const sc = shortcutById(gCursorId);
      if (sc) {
        const child = (sc.children && sc.children.length && sc.cur > 0) ? sc.children[sc.cur - 1] : null;
        openUrl(child ? child.url : sc.url);
      }
    }
  });
}

/* ---------------- 空白处菜单（右键 / 触屏长按） ---------------- */
function showBlankMenu(x, y){
  showMenu(x, y, {
    head: "导航",
    items: [
      { label: "新建快捷方式", icon: "plus", onClick: openShortcutNewModal },
      "-",
      { label: "设置", icon: "gear", onClick: () => openSettings("appearance") }
    ]
  });
}
function bindBlankMenu(){
  document.addEventListener("contextmenu", e => {
    e.preventDefault();
    if (modalStack.length) return;
    if (
      e.target.closest(".card") || e.target.closest(".engine-row") ||
      e.target.closest(".model-opt") || e.target.closest(".msg") ||
      e.target.closest(".row-item") || e.target.closest(".m") ||
      e.target.closest(".ctx") || e.target.closest("#chatPanel")
    ) return;
    hideMenu();
    showBlankMenu(e.clientX, e.clientY);
  });
  let lp = null, lpx = 0, lpy = 0;
  document.addEventListener("touchstart", e => {
    const t = e.target;
    if (
      t.closest(".card") || t.closest(".m") || t.closest(".ctx") ||
      t.closest("#chatPanel") || t.closest(".engine-row") || t.closest(".row-item") ||
      t.closest(".msg") || isTypingTarget(t) || t.closest(".searchbar") || t.closest(".drop")
    ) return;
    const touch = e.touches[0];
    lpx = touch.clientX; lpy = touch.clientY;
    lp = setTimeout(() => showBlankMenu(lpx, lpy), 600);
  }, { passive: true });
  ["touchmove", "touchend", "touchcancel"].forEach(evt =>
    document.addEventListener(evt, () => clearTimeout(lp), { passive: true })
  );
}

/* ---------------- 吉祥物 ---------------- */
let mascotTimer = null;
function mascot(st){
  const el = $("#mascot");
  if (!el) return;
  el.classList.remove("happy", "wink", "sad");
  if (mascotTimer) clearTimeout(mascotTimer);
  if (st === "happy") {
    el.classList.add("happy");
    mascotTimer = setTimeout(() => el.classList.remove("happy"), 1700);
  } else if (st === "wink") {
    el.classList.add("wink");
    mascotTimer = setTimeout(() => el.classList.remove("wink"), 1900);
  } else if (st === "sad") {
    el.classList.add("sad");
    mascotTimer = setTimeout(() => el.classList.remove("sad"), 1700);
  }
}
function spawnSparkles(){
  const host = $("#mascotBurst");
  if (!host) return;
  for (let i = 0; i < 6; i++) {
    const s = document.createElement("span");
    s.className = "burst-star";
    s.appendChild(icon("star"));
    const ang = (Math.PI * 2 * i) / 6 + Math.random() * 0.5;
    const dist = 46 + Math.random() * 40;
    s.style.setProperty("--tx", Math.cos(ang) * dist + "px");
    s.style.setProperty("--ty", Math.sin(ang) * dist + "px");
    host.appendChild(s);
    setTimeout(() => s.remove(), 750);
  }
}
function bindMascot(){
  const el = $("#mascot");
  el.addEventListener("click", () => {
    spawnSparkles();
    mascot("happy");
    toast("你好，有什么可以帮你的？", "ok", "sparkle");
  });
  el.addEventListener("mouseenter", () => mascot("wink"));
  setInterval(() => {
    if (!el.matches(":hover")) mascot("wink");
  }, 9000);
}

/* ---------------- 背景装饰 / 日期 ---------------- */
function buildDecor(){
  const bg = $("#bgDecor");
  if (!bg || bg.children.length) return;
  const names = ["star", "sparkle", "cloud", "moon", "heart", "bolt"];
  const svgs = {};
  names.forEach(n => { svgs[n] = iconSVG(n); });
  for (let i = 0; i < 10; i++) {
    const d = document.createElement("div");
    d.className = "deco";
    d.appendChild(svgs[names[i % names.length]].cloneNode(true));
    const size = 15 + Math.random() * 32;
    d.style.width = size + "px";
    d.style.height = size + "px";
    d.style.left = (Math.random() * 94) + "%";
    d.style.top = (Math.random() * 88) + "%";
    d.style.color = Math.random() > 0.5 ? "var(--accent2)" : "var(--accent)";
    d.style.opacity = (0.22 + Math.random() * 0.3).toFixed(2);
    d.style.setProperty("--dur", (8 + Math.random() * 10).toFixed(1) + "s");
    d.style.setProperty("--delay", (-Math.random() * 10).toFixed(1) + "s");
    bg.appendChild(d);
  }
}
function updateDateText(){
  const now = new Date();
  const week = ["日", "一", "二", "三", "四", "五", "六"][now.getDay()];
  const dt = $("#dateText");
  if (dt) dt.textContent = (now.getMonth() + 1) + "月" + now.getDate() + "日 星期" + week;
  const h = now.getHours();
  const g = h < 5 ? "夜深了，注意休息" : h < 9 ? "早上好" : h < 12 ? "上午好" : h < 14 ? "中午好" : h < 18 ? "下午好" : "晚上好";
  const gt = $("#greetText");
  if (gt) gt.textContent = g;
}
function updateClock(){
  const chip = $("#clockChip");
  if (!chip) return;
  chip.classList.toggle("hidden", !state.showClock);
  const el = $("#clockText");
  if (!el || !state.showClock) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  el.textContent = state.showSeconds ? hh + ":" + mm + ":" + ss : hh + ":" + mm;
}

/* ---------------- 渲染总入口 / 初始化 ---------------- */
function renderAll(){
  applyTheme(state.theme);
  applyLayout(state.layout || "standard");
  renderEngineChip();
  renderGrid();
  renderHistoryDropdown();
  updateChatHeader();
  updateChatHint();
  updateDateText();
  updateClock();
  buildDecor();
  renderDress();
}
function init(){
  loadState();
  renderAll();
  bindSearch();
  bindMascot();
  bindChat();
  bindKeyboard();
  bindBlankMenu();
  initGamepad();
  $("#fileImport").addEventListener("change", e => {
    const f = e.target.files[0];
    if (f) importConfigFile(f);
    e.target.value = "";
  });
  $("#fileEngineBatch").addEventListener("change", e => {
    const f = e.target.files[0];
    if (f) handleBatchFile(f);
    e.target.value = "";
  });
  /* 点击空白处关闭下拉层（弹窗不受影响，仅 X 可关） */
  document.addEventListener("pointerdown", e => {
    if (!e.target.closest(".drop") && !e.target.closest("#searchbar")) closeAllDrops();
    if (!e.target.closest(".ctx")) hideMenu();
  });
  window.addEventListener("resize", debounce(() => { applyGridVars(); }, 120));
  window.addEventListener("orientationchange", () => setTimeout(() => applyGridVars(), 260));
  maybeWelcome();
  bindExtras();
  setInterval(updateClock, 1000);
  setInterval(refreshAllBalances, 60000);
  setTimeout(refreshAllBalances, 1500);
}
init();
</script>
