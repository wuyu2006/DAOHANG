<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#fdf4e3">
<title>导航首页</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='40' fill='%23fff8ec' stroke='%23c8a96f' stroke-width='5'/%3E%3Ccircle cx='35' cy='50' r='5' fill='%235d4a2e'/%3E%3Ccircle cx='65' cy='50' r='5' fill='%235d4a2e'/%3E%3Cpath d='M38 68 Q50 78 62 68' stroke='%235d4a2e' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cellipse cx='26' cy='62' rx='8' ry='5' fill='%23ff9db1' opacity='.7'/%3E%3Cellipse cx='74' cy='62' rx='8' ry='5' fill='%23ff9db1' opacity='.7'/%3E%3C/svg%3E">
<style>
/* ============================================================
   导航页 · 全局基础与重置
   设计语言：2D 线条风格 / 马卡龙色系 / 圆角设计
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --font:"Nunito","HarmonyOS Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --radius-xl:28px;--radius-lg:22px;--radius-md:16px;--radius-sm:12px;--radius-xs:8px;
  --line-w:2px;
  --gap:14px;
  --ease-pop:cubic-bezier(.34,1.56,.64,1);
  --ease-soft:cubic-bezier(.22,.8,.3,1);
  --danger:#e25b74;--danger-bg:#fff0f3;--ok:#3f9e6f;
  --focus-ring:0 0 0 4px var(--glow);
}
html{height:100%;-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font);
  min-height:100dvh;
  background:var(--bg);
  background-image:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--text);
  line-height:1.5;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
  transition:background .45s ease,color .3s ease;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;border:none;outline:none;background:none;-webkit-appearance:none;appearance:none}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
input:focus-visible,textarea:focus-visible{outline:none}

/* 滚动条（全部自绘，禁用浏览器默认样式） */
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:999px;border:2.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--accent);border:2.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}

/* ============================================================
   主题系统（14 套，4x3+ 排列，实时预览）
   ============================================================ */
body[data-theme="milk"]{color-scheme:light;--bg:#fdf4e3;--bg2:#f7e8cf;--panel:#fffaf1;--card:#fffdf7;--line:#ecd9b4;--line2:#c8a96f;--text:#5d4a2e;--text2:#9b8a64;--accent:#ff9db1;--accent2:#ffc46b;--shadow:rgba(178,142,88,.16);--glow:rgba(255,157,177,.32)}
body[data-theme="sakura"]{color-scheme:light;--bg:#fff0f3;--bg2:#ffe3ea;--panel:#fff7f9;--card:#fffbfc;--line:#f3c6d2;--line2:#e09bb0;--text:#7a4a5a;--text2:#b58a97;--accent:#ff7fa2;--accent2:#ffb3c7;--shadow:rgba(224,128,158,.18);--glow:rgba(255,127,162,.32)}
body[data-theme="mint"]{color-scheme:light;--bg:#edfaf3;--bg2:#dcf5e6;--panel:#f6fdf9;--card:#fbfffc;--line:#c3e8d1;--line2:#7fc9a0;--text:#2f5c46;--text2:#77a08c;--accent:#4fd0a0;--accent2:#8fe3c2;--shadow:rgba(80,180,140,.16);--glow:rgba(79,208,160,.32)}
body[data-theme="lavender"]{color-scheme:light;--bg:#f3f0fc;--bg2:#e7e0fa;--panel:#faf8ff;--card:#fdfcff;--line:#d9cdf0;--line2:#a992d8;--text:#4f3f74;--text2:#9485b8;--accent:#a78bfa;--accent2:#c9b8ff;--shadow:rgba(140,110,200,.18);--glow:rgba(167,139,250,.32)}
body[data-theme="peach"]{color-scheme:light;--bg:#fff3ec;--bg2:#ffe7d9;--panel:#fffaf6;--card:#fffdfb;--line:#f5cfba;--line2:#e2a27e;--text:#6e4327;--text2:#b08a6e;--accent:#ff9a62;--accent2:#ffc98a;--shadow:rgba(220,140,90,.18);--glow:rgba(255,154,98,.32)}
body[data-theme="lemon"]{color-scheme:light;--bg:#fffbee;--bg2:#fff3cf;--panel:#fffef8;--card:#fffffd;--line:#f1e2ac;--line2:#d9b94f;--text:#5f5217;--text2:#a2945a;--accent:#ffcf4d;--accent2:#ffe9a3;--shadow:rgba(200,170,60,.18);--glow:rgba(255,207,77,.34)}
body[data-theme="matcha"]{color-scheme:light;--bg:#f2f6e8;--bg2:#e4ecd3;--panel:#fafcf4;--card:#fefffa;--line:#d8e2bd;--line2:#a3b878;--text:#3f4d28;--text2:#8a9a68;--accent:#8fbf5f;--accent2:#c3dc92;--shadow:rgba(120,150,70,.16);--glow:rgba(143,191,95,.32)}
body[data-theme="ocean"]{color-scheme:light;--bg:#eef6fc;--bg2:#dcecf8;--panel:#f7fcff;--card:#fcfeff;--line:#c4ddf0;--line2:#7fb3dc;--text:#2c5270;--text2:#6f9ab8;--accent:#5cb8f0;--accent2:#9ed9ff;--shadow:rgba(90,150,200,.18);--glow:rgba(92,184,240,.32)}
body[data-theme="berry"]{color-scheme:light;--bg:#fdf0f5;--bg2:#f9dfea;--panel:#fff8fb;--card:#fffcfd;--line:#f0c3d6;--line2:#d98fb1;--text:#6e2f4a;--text2:#b08399;--accent:#e75b9b;--accent2:#f5a6c8;--shadow:rgba(210,90,150,.18);--glow:rgba(231,91,155,.32)}
body[data-theme="caramel"]{color-scheme:light;--bg:#f7efe6;--bg2:#ecdfd0;--panel:#fcf7f1;--card:#fffdfa;--line:#e5d2bd;--line2:#bfa17e;--text:#5b4026;--text2:#a0876a;--accent:#c98d5f;--accent2:#e8bd93;--shadow:rgba(160,120,80,.18);--glow:rgba(201,141,95,.3)}
body[data-theme="night"]{color-scheme:dark;--bg:#1d1b2b;--bg2:#14121f;--panel:#262337;--card:#2c2940;--line:#4a4568;--line2:#7a74a8;--text:#e8e6f5;--text2:#9a94bd;--accent:#a78bfa;--accent2:#6ee7d0;--shadow:rgba(0,0,0,.38);--glow:rgba(167,139,250,.3)}
body[data-theme="charcoal"]{color-scheme:dark;--bg:#22242a;--bg2:#17181d;--panel:#2b2e36;--card:#31343d;--line:#4a4e5a;--line2:#80879a;--text:#eceef3;--text2:#a2a7b5;--accent:#7fd0f0;--accent2:#ffd479;--shadow:rgba(0,0,0,.42);--glow:rgba(127,208,240,.3)}
body[data-theme="soda"]{color-scheme:light;--bg:#f0f7fb;--bg2:#e0eff7;--panel:#f8fcfe;--card:#fcfeff;--line:#cfe4f0;--line2:#8fbcd6;--text:#33586c;--text2:#7d9fb3;--accent:#66c0e8;--accent2:#a8e0f5;--shadow:rgba(90,160,200,.16);--glow:rgba(102,192,232,.32)}
body[data-theme="sunset"]{color-scheme:light;--bg:#fdf1e6;--bg2:#faddc4;--panel:#fff8f1;--card:#fffdfa;--line:#f3cdae;--line2:#de9d6e;--text:#6b3c1d;--text2:#b28a68;--accent:#ff7f50;--accent2:#ffab70;--shadow:rgba(220,120,60,.18);--glow:rgba(255,127,80,.32)}
body[data-theme="midnight"]{color-scheme:dark;--bg:#0f1729;--bg2:#1a2540;--panel:#1a2540;--card:#1e2d4d;--line:#2e3d5e;--line2:#5a6f9e;--text:#e2e8f5;--text2:#8898b8;--accent:#5b8def;--accent2:#7bb5ff;--shadow:rgba(0,0,0,.5);--glow:rgba(91,141,239,.3)}
body[data-theme="forest"]{color-scheme:dark;--bg:#14261c;--bg2:#1e3528;--panel:#1e3528;--card:#244031;--line:#355040;--line2:#5e8070;--text:#d8ecd8;--text2:#7a9a88;--accent:#4cc48a;--accent2:#6fe0a8;--shadow:rgba(0,0,0,.5);--glow:rgba(76,196,138,.3)}
body[data-theme="royal"]{color-scheme:dark;--bg:#1a1030;--bg2:#261845;--panel:#261845;--card:#2e1e52;--line:#3e2a68;--line2:#7058a0;--text:#e8e0f8;--text2:#9080b0;--accent:#9b6ff0;--accent2:#b895ff;--shadow:rgba(0,0,0,.5);--glow:rgba(155,111,240,.3)}
body[data-theme="mocha"]{color-scheme:dark;--bg:#221814;--bg2:#2e2018;--panel:#2e2018;--card:#3a2820;--line:#4a3528;--line2:#7a5c48;--text:#f0e0d0;--text2:#a08870;--accent:#c88a5a;--accent2:#e0aa78;--shadow:rgba(0,0,0,.5);--glow:rgba(200,138,90,.3)}
body[data-theme="rose"]{color-scheme:dark;--bg:#2a1420;--bg2:#381a2a;--panel:#381a2a;--card:#442034;--line:#542a42;--line2:#8a4a6a;--text:#f8e0e8;--text2:#b08098;--accent:#e06090;--accent2:#f088b0;--shadow:rgba(0,0,0,.5);--glow:rgba(224,96,144,.3)}
body[data-theme="slate"]{color-scheme:dark;--bg:#181c22;--bg2:#242a33;--panel:#242a33;--card:#2c3440;--line:#3a4452;--line2:#607088;--text:#e0e6ee;--text2:#8090a8;--accent:#60a8d8;--accent2:#80c0f0;--shadow:rgba(0,0,0,.5);--glow:rgba(96,168,216,.3)}

/* ========== 布局预设（8 种，改变整体排版） ========== */
body[data-layout="standard"]{--layout-gap:14px;--layout-cols:8}
body[data-layout="left"] .top,
body[data-layout="left"] main,
body[data-layout="left"] .grid-wrap{max-width:none;padding-left:32px;padding-right:32px}
body[data-layout="left"] .search-wrap{margin-left:0}
body[data-layout="left"] .greet{text-align:left}
body[data-layout="topbar"] .top{padding-top:10px}
body[data-layout="topbar"] .greet h1{font-size:18px}
body[data-layout="topbar"] .greet p{display:none}
body[data-layout="topbar"] .search-wrap{margin-top:6px;max-width:none}
body[data-layout="split"] .top{flex-direction:column;align-items:flex-start;gap:8px}
body[data-layout="split"] .top-left{flex-direction:row}
body[data-layout="split"] main{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
body[data-layout="split"] .search-wrap{max-width:none;margin:0}
body[data-layout="split"] .grid-wrap{max-width:none}
body[data-layout="compact"]{--layout-gap:8px;--layout-cols:8}
body[data-layout="compact"] .grid-head{padding-bottom:6px}
body[data-layout="compact"] .card-name{font-size:12px}
body[data-layout="compact"] .card-host{display:none}
body[data-layout="hero"] .search-wrap{max-width:900px;margin:30px auto 30px}
body[data-layout="hero"] .searchbar{padding:16px 16px 16px 14px;font-size:16px}
body[data-layout="hero"] .engine-chip{padding:12px 18px;font-size:15px}
body[data-layout="hero"] #searchInput{font-size:16px}
body[data-layout="zen"] .deco,
body[data-layout="zen"] .daily-quote,
body[data-layout="zen"] .search-tips,
body[data-layout="zen"] .mascot-wrap{display:none!important}
body[data-layout="zen"] .card-back,
body[data-layout="zen"] .card-tip{display:none!important}
body[data-layout="zen"] .grid-wrap{max-width:none}
body[data-layout="wide"]{--layout-cols:10}
body[data-layout="wide"] .top,
body[data-layout="wide"] main,
body[data-layout="wide"] .grid-wrap{max-width:1440px}
body[data-layout="wide"] .search-wrap{max-width:860px}

/* 背景装饰层：漂浮的线条星星与云朵 */
#bgDecor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco{position:absolute;opacity:.5;animation:floaty var(--dur,9s) ease-in-out infinite;animation-delay:var(--delay,0s)}
.deco svg{width:100%;height:100%}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-16px) rotate(6deg)}}

/* ============================================================
   页面骨架：头部 / 主体 / 页脚
   ============================================================ */
#app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px 6px;max-width:1240px;width:100%;margin:0 auto}
.top-left{display:flex;align-items:center;gap:14px;min-width:0}
.greet h1{font-size:22px;font-weight:900;letter-spacing:1px;color:var(--text);display:flex;align-items:center;gap:8px}
.greet h1 .title-star{width:20px;height:20px;color:var(--accent2);flex:none}
.greet p{font-size:12.5px;color:var(--text2);margin-top:2px;font-weight:600}
.top-right{display:flex;align-items:center;gap:10px;flex:none}
.date-chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--text2);box-shadow:0 4px 12px var(--shadow)}
.date-chip svg{width:15px;height:15px;color:var(--accent)}
.clock-chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:800;color:var(--text);box-shadow:0 4px 12px var(--shadow);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.clock-chip svg{width:15px;height:15px;color:var(--accent)}
.clock-chip.hidden{display:none}

main{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:8px 18px 30px}

/* ============================================================
   吉祥物（SVG 线条卡通，可交互表情，禁止 emoji）
   ============================================================ */
.mascot-wrap{position:relative;flex:none;width:96px;height:96px}
#mascot{width:100%;height:100%;cursor:pointer;display:block;transition:transform .25s var(--ease-pop);filter:drop-shadow(0 6px 10px var(--shadow))}
#mascot:hover{transform:scale(1.08) rotate(-3deg)}
#mascot:active{transform:scale(.94)}
.ms-body{fill:var(--card);stroke:var(--line2);stroke-width:3.5;stroke-linejoin:round}
.ms-ear{fill:var(--card);stroke:var(--line2);stroke-width:3.5}
.ms-cheek{fill:var(--accent);opacity:.55}
.ms-eye{fill:var(--text)}
.ms-eye-line{stroke:var(--text);stroke-width:3.5;stroke-linecap:round;fill:none}
.ms-brow{stroke:var(--line2);stroke-width:3;stroke-linecap:round;fill:none}
.ms-mouth{stroke:var(--text);stroke-width:3.5;stroke-linecap:round;fill:none}
.ms-mouth-fill{fill:var(--accent);stroke:var(--text);stroke-width:3;stroke-linecap:round}
.ms-sparkle{fill:var(--accent2)}
.ms-inner{stroke:var(--line);stroke-width:3;stroke-dasharray:4 6;opacity:.5}
/* 表情状态切换（默认睁眼微笑；wink 眨眼微笑；happy 弯眼张嘴；sad 垂眼撇嘴） */
.ms-group-wink{display:none}
#mascot.wink .ms-group-open,#mascot.happy .ms-group-open,#mascot.sad .ms-group-open{display:none}
#mascot.wink .ms-group-wink,#mascot.happy .ms-group-wink,#mascot.sad .ms-group-wink{display:block}
.ms-mouth-open,.ms-mouth-sad{display:none}
#mascot.happy .ms-mouth-smile,#mascot.sad .ms-mouth-smile{display:none}
#mascot.happy .ms-mouth-open{display:block}
#mascot.sad .ms-mouth-sad{display:block}
/* 默认眨眼动画 */
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%,98%{transform:scaleY(.08)}}
.ms-eye-l{transform-origin:center;animation:blink 4.6s infinite}
.ms-eye-r{transform-origin:center;animation:blink 4.6s infinite .12s}
#mascot.wink .ms-eye-l,#mascot.wink .ms-eye-r,#mascot.happy .ms-eye-l,#mascot.happy .ms-eye-r,#mascot.sad .ms-eye-l,#mascot.sad .ms-eye-r{animation:none}
/* 点击时爆出小星星 */
.mascot-burst{position:absolute;left:50%;top:50%;pointer-events:none;z-index:5}
.mascot-burst .burst-star{position:absolute;width:14px;height:14px;color:var(--accent2);animation:burstOut .7s var(--ease-soft) forwards}
@keyframes burstOut{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:0}20%{opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1) rotate(80deg);opacity:0}}
.ms-halo{animation:haloSpin 14s linear infinite;transform-origin:center}
@keyframes haloSpin{to{transform:rotate(360deg)}}

/* ============================================================
   搜索区
   ============================================================ */
.search-wrap{max-width:760px;margin:14px auto 22px;padding:0 4px}
.searchbar{position:relative;display:flex;align-items:center;gap:10px;background:var(--panel);border:2.5px solid var(--line2);border-radius:999px;padding:9px 9px 9px 8px;box-shadow:0 10px 26px var(--shadow);transition:border-color .2s,box-shadow .2s,transform .2s}
.searchbar:focus-within{border-color:var(--accent);box-shadow:0 12px 30px var(--shadow),var(--focus-ring)}
.engine-chip{display:flex;align-items:center;gap:7px;background:var(--bg2);border:2px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800;color:var(--text);cursor:pointer;transition:all .18s;flex:none;max-width:150px}
.engine-chip:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg2));transform:translateY(-1px)}
.engine-chip .chip-ico{width:18px;height:18px;flex:none}
.engine-chip .chip-caret{width:13px;height:13px;color:var(--text2);transition:transform .2s;flex:none}
.engine-chip.open .chip-caret{transform:rotate(180deg)}
#searchInput{flex:1;min-width:0;font-size:16px;font-weight:600;color:var(--text);padding:8px 2px;background:transparent}
#searchInput::placeholder{color:var(--text2);font-weight:500;opacity:.85}
.search-btn{width:46px;height:46px;flex:none;border-radius:50%;background:var(--accent);border:2.5px solid color-mix(in srgb,var(--accent) 75%,#000);display:grid;place-items:center;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.14);transition:transform .15s,box-shadow .15s,filter .2s;position:relative}
.search-btn:hover{filter:brightness(1.06);transform:translateY(-1px) rotate(-4deg)}
.search-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.search-btn svg{width:21px;height:21px}
.search-tips{display:flex;gap:14px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.search-tips span{font-size:11.5px;color:var(--text2);font-weight:600;background:var(--panel);border:1.5px dashed var(--line);border-radius:999px;padding:3px 12px}

/* 下拉层（引擎选择 / 搜索记录），全部自绘样式 */
.drop{position:absolute;top:calc(100% + 10px);left:0;right:0;background:var(--panel);border:2px solid var(--line2);border-radius:var(--radius-lg);box-shadow:0 16px 40px var(--shadow);padding:7px;z-index:80;animation:dropIn .22s var(--ease-pop)}
@keyframes dropIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.drop-engine{left:0;width:min(250px,86vw)}
.drop-head{display:flex;align-items:center;justify-content:space-between;padding:5px 8px 7px;font-size:11.5px;font-weight:800;color:var(--text2);letter-spacing:1px}
.drop-list{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.drop-foot{display:flex;gap:8px;padding:8px 4px 3px;border-top:2px dashed var(--line);margin-top:7px}
.engine-row{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:700;transition:background .14s;position:relative;text-align:left}
.engine-row:hover{background:var(--bg2)}
.engine-row.active{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--text)}
.engine-row .e-ico{width:19px;height:19px;flex:none;color:var(--accent)}
.engine-row .e-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.engine-row .e-check{width:17px;height:17px;color:var(--accent);flex:none;opacity:0}
.engine-row.active .e-check{opacity:1}
.hitem{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:600;transition:background .14s;position:relative;text-align:left}
.hitem:hover{background:var(--bg2)}

.search-clear{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--text2);cursor:pointer;opacity:0;transform:scale(.6);transition:all .18s;pointer-events:none}
.searchbar.has-text .search-clear{opacity:1;transform:scale(1);pointer-events:auto}
.search-clear:hover{background:var(--bg2);color:var(--danger)}
.search-clear svg{width:15px;height:15px}

/* 每日一言 */
.daily-quote{display:flex;align-items:center;gap:7px;justify-content:center;margin:2px 0 12px;font-size:12px;font-weight:600;color:var(--text2)}
.daily-quote svg{width:14px;height:14px;color:var(--accent);flex:none}
.daily-quote span{max-width:min(72vw,520px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 停用引擎行 */
.engine-row.disabled:hover{background:transparent}
.engine-row.disabled .e-ico{color:var(--text2)}

/* 空状态里的新建按钮 */
.grid-empty .btn{margin-top:2px}

/* 卡片标题悬浮提示由 title 属性承担，悬停时轻微抬高提示角标 */
.card:hover .card-tip{z-index:5}

/* 用户气泡文字对比度 */
.msg.user .bubble{color:var(--text);font-weight:600}

/* 拖拽中的指针 */
.grid.dragging .card-shell{cursor:grabbing}
.drag-ghost .card-shell{cursor:grabbing}

/* 主题卡片按压反馈 */
.theme-card:active{transform:scale(.96)}
.size-card:active{transform:scale(.95)}
.switch:active::after{transform:scale(.9)}

/* 弹窗正文段落边距 */
.m-body p{margin:0 0 8px}

/* 设置说明里的代码样式 */
.set-note code{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-family:ui-monospace,Consolas,monospace;font-size:11px}

/* API 头部在小屏换行 */
@media (max-width:420px){
  .api-head{flex-wrap:wrap}
  .api-head .spacer{display:none}
  .provider-pick{grid-template-columns:1fr}
}

/* FAB 标签在窄屏隐藏 */
@media (max-width:520px){
  .fab-label{display:none}
}

/* Toast 在触屏上的安全距离 */
.toast-root{bottom:calc(22px + env(safe-area-inset-bottom))}

/* 下拉空态更宽松 */
.drop-empty{padding:22px 10px}

/* 引擎下拉在窄屏不超出 */
.drop-engine{max-height:min(60vh,340px);display:flex;flex-direction:column}
.drop-engine .drop-list{flex:1;min-height:0}

/* 主题切换时卡片与弹窗的过渡更柔和 */
.card-shell,.chat,.m,.drop,.searchbar{transition:border-color .25s ease,box-shadow .25s ease,transform .25s var(--ease-pop),background .25s ease}

/* 聊天面板顶部标题单行截断 */
.chat-title b{max-width:220px}

/* 帮助条目键盘样式内边距 */
.help-item .kbd{margin:0 2px}

/* 欢迎弹窗在窄屏的图文间距 */
@media (max-width:420px){
  .welcome-hero{padding-top:2px}
  .welcome-hero svg{width:50px;height:50px}
}

/* 尺寸选择器在小屏横向滚动兜底 */
.size-grid{overflow-x:auto;padding-bottom:2px}

/* 设置弹窗在超小屏占满 */
@media (max-width:480px){
  .m{width:100%;max-height:92vh;border-radius:20px}
}

/* 下拉层的进入动画在移动端更轻 */
@media (prefers-reduced-motion:no-preference){
  .drop{transform-origin:top center}
}

/* iOS Safari：表单元素 >= 16px，避免聚焦时页面自动缩放 */
@media (max-width:760px){
  #chatInput,.input{font-size:16px}
}

/* 横版与大方卡的内容细节 */
.card[data-cw="2"][data-ch="1"] .card-ico{width:36px;height:36px}
.card[data-cw="2"][data-ch="2"] .card-front,.card[data-cw="2"][data-ch="2"] .card-back{gap:10px;padding:14px}
.card[data-cw="2"][data-ch="2"] .card-host{margin-top:-2px}
.card .card-host{transition:color .2s}
.card:hover .card-host{color:var(--accent)}
</style>
</head>
<body data-theme="milk">

<!-- 背景装饰层：漂浮的线条星星与云朵 -->
<div id="bgDecor" aria-hidden="true"></div>

<div id="app">

  <!-- ============ 顶部：吉祥物 + 问候 + 日期 ============ -->
  <header class="top">

            <ellipse class="ms-cheek" cx="89" cy="68" rx="9" ry="5.5"/>
            <ellipse cx="60" cy="63" rx="3.4" ry="2.4" fill="var(--accent)" opacity=".8"/>
            <g class="ms-group-open">
              <circle class="ms-eye ms-eye-l" cx="45" cy="55" r="5"/>
              <circle class="ms-eye ms-eye-r" cx="75" cy="55" r="5"/>
              <path class="ms-brow" d="M38 44q7 -5 14 0M68 44q7 -5 14 0"/>
            </g>
            <g class="ms-group-wink">
              <path class="ms-eye-line" d="M40 57q5 -5 10 0"/>
              <circle class="ms-eye" cx="75" cy="56" r="5"/>
              <path class="ms-brow" d="M38 44q7 -5 14 0M68 44q7 -5 14 0"/>
            </g>
            <path class="ms-mouth ms-mouth-smile" d="M47 73q13 10 26 0"/>
            <path class="ms-mouth-open ms-mouth-fill" d="M48 70q12 15 24 0z"/>
            <path class="ms-mouth-sad ms-mouth" d="M48 79q12 -10 24 0"/>
            <path class="ms-sparkle" d="M18 22l2 5.5 5.5 2-5.5 2-2 5.5-2-5.5-5.5-2 5.5-2 2-5.5z"/>
            <path class="ms-sparkle" d="M100 22l1.6 4.4 4.4 1.6-4.4 1.6-1.6 4.4-1.6-4.4-4.4-1.6 4.4-1.6 1.6-4.4z"/>
            <path class="ms-sparkle" d="M96 90l1.4 3.8 3.8 1.4-3.8 1.4-1.4 3.8-1.4-3.8-3.8-1.4 3.8-1.4 1.4-3.8z"/>
            <g id="dressBack" stroke="var(--line2)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
            <g id="dressHat" stroke="var(--line2)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
            <g id="dressFace" stroke="var(--accent)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></g>
          </svg>
        </button>
        <div class="mascot-burst" id="mascotBurst"></div>
      </div>
      <div class="greet">
        <h1>
          <svg class="title-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg>
          导航
        </h1>
        <p id="greetText">欢迎使用</p>
      </div>
    </div>
    <div class="top-right">
      <div class="clock-chip" id="clockChip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span id="clockText">--:--</span>
      </div>
      <div class="date-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <span id="dateText">--</span>
      </div>
    </div>
  </header>

  <!-- ============ 主体 ============ -->
  <main>

    <!-- 搜索区 -->
    <section class="search-wrap">
      <div class="searchbar" id="searchbar">
        <button class="engine-chip" id="engineChip" title="切换搜索引擎">
          <svg class="chip-ico" id="chipIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
          <span class="chip-name" id="chipName">百度</span>
          <svg class="chip-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <input id="searchInput" type="text" placeholder="搜索点什么吧…" autocomplete="off" spellcheck="false" maxlength="200" aria-label="搜索框">
        <button class="search-btn" id="searchBtn" title="搜索" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>

        <!-- 搜索引擎下拉 -->
        <div class="drop drop-engine" id="engineDropdown" hidden>
          <div class="drop-head"><span>选择搜索引擎</span></div>
          <div class="drop-list" id="engineList"></div>
          <div class="drop-foot">
            <button class="btn sm" id="engineAddBtn" style="flex:1">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg>
              添加
            </button>
            <button class="btn sm" id="engineManageBtn" style="flex:1">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/><path d="M7.5 12h9"/></svg>
              管理
            </button>
          </div>
        </div>

        <!-- 搜索记录下拉 -->
        <div class="drop" id="historyDropdown" hidden>
          <div class="drop-head"><span>搜索记录</span></div>
          <div class="drop-list" id="historyList"></div>
          <button class="drop-clear" id="historyClear" hidden>清空全部记录</button>
        </div>
      </div>
      <div class="daily-quote">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg>
        <span id="dailyQuote">保持专注，高效工作</span>
      </div>
    </section>

    <!-- 快捷方式网格 -->
    <section class="grid-wrap">
      <div class="grid-head">
        <span class="gh-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
          我的快捷方式
        </span>
        <span class="gh-count" id="gridCount">0 个</span>
      </div>
      <div class="grid" id="grid">
        <div class="grid-overlay" id="gridOverlay" aria-hidden="true"></div>
      </div>
    </section>

  </main>

  <!-- ============ 页脚 ============ -->
  <footer class="foot">
    <span>
      导航
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7.5-4.7-9.5-9A5.4 5.4 0 0 1 12 6.4 5.4 5.4 0 0 1 21.5 12c-2 4.3-9.5 9-9.5 9z"/></svg>
      右键空白处新建快捷方式 · 右键卡片更多操作
    </span>
  </footer>
</div>

<!-- ============ AI 聊天 ============ -->
<button class="fab" id="fab" aria-label="AI 聊天">
  <span class="fab-ring"></span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="9" width="14" height="11" rx="3"/><circle cx="9.5" cy="13.5" r="1.4"/><circle cx="14.5" cy="13.5" r="1.4"/><path d="M9.5 16.5h5M12 9V5.5M9.5 5.5h5"/></svg>

</button>

    <div class="chat-title">
      <b id="chatModelName">尚未配置模型</b>

    </div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>

    </button>

  <div class="chat-multi-bar">

    <button class="btn danger sm" id="chatMultiDel">删除所选</button>
    <button class="btn ghost sm" id="chatMultiCancel">取消</button>
  </div>

  <div class="chat-msgs" id="chatMsgs">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10.5" r="1.2"/><circle cx="15" cy="10.5" r="1.2"/><path d="M9 14.5c.8 1 1.9 1.5 3 1.5s2.2-.5 3-1.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>
      配置好模型后，在这里和 AI 聊天吧<br>对话记录最多自动保存 50 条

  <div class="chat-foot">
    <div class="chat-toolbar">
      <span class="t-hint" id="chatHint">Enter 发送 · Ctrl+Enter 换行</span>
      <button id="chatClearBtn">清空对话</button>
    </div>
    <textarea id="chatInput" rows="1" placeholder="说点什么…（最多 500 字）" aria-label="聊天输入框"></textarea>
    <div class="chat-actions">
      <span class="cnt" id="chatChar">0/500</span>

      </button>
    </div>
  </div>
</section>

/* ---------------- 基础工具 ---------------- */
const $  = (sel, root) => (root || document).querySelector(sel);

function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
function debounce(fn, ms){ let t; return function(){ const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms); }; }

/* 内联 SVG 图标工厂：统一线条风格，禁止 emoji */
function icon(name, cls, size){
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "2");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  if (cls) svg.setAttribute("class", cls);
  if (size) { svg.style.width = size + "px"; svg.style.height = size + "px"; }
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", "#i-" + name);
  svg.appendChild(use);
  return svg;
}

function defaultState(){

    version: VERSION,

    lastEngineId: "baidu",

    showSeconds: false,
    devMode: false
  };

/* ---------------- 状态持久化 ---------------- */
let state = defaultState();

function loadState(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (!d || d.version !== VERSION) return;
    const base = defaultState();
    state = {
      ...base,
      ...d,
      engines: Array.isArray(d.engines) && d.engines.length ? d.engines : base.engines,
      shortcuts: Array.isArray(d.shortcuts) ? d.shortcuts : base.shortcuts,
      apis: Array.isArray(d.apis) ? d.apis : [],
      chats: Array.isArray(d.chats) ? d.chats : [],
      searchHistory: Array.isArray(d.searchHistory) ? d.searchHistory.slice(0, MAX_HISTORY) : []
    };
  } catch (e) { /* 存储损坏则使用默认 */ }
}
function saveState(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch (e) { toast("保存失败：浏览器存储不可用", "err", "warning"); }
}

/* ---------------- Toast ---------------- */
function toast(msg, type, iconName){
  const root = $("#toastRoot");
  const el = document.createElement("div");
  el.className = "toast" + (type ? " t-" + type : "");
  el.appendChild(icon(iconName || (type === "err" ? "warning" : type === "ok" ? "check" : "sparkle")));
  const span = document.createElement("span");
  span.textContent = msg;
  el.appendChild(span);
  root.appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 300); }, 2400);
  if (root.children.length > 4) root.firstChild.remove();
}

/* ---------------- 弹窗系统（空白处点击不关闭，仅 X 可关） ---------------- */
const modalStack = [];
function openModal(opts){
  const { title, iconName, body, foot, wide, sm, onX } = opts;
  const root = $("#modalRoot");
  const back = document.createElement("div");
  back.className = "m-backdrop";
  const m = document.createElement("div");
  m.className = "m" + (wide ? " wide" : "") + (sm ? " sm" : "");
  m.setAttribute("role", "dialog");
  m.setAttribute("aria-modal", "true");

  const head = document.createElement("div");
  head.className = "m-head";
  const t = document.createElement("div");
  t.className = "m-title";
  if (iconName) t.appendChild(icon(iconName, "t-ico"));
  const tSpan = document.createElement("span");
  tSpan.textContent = title || "";
  t.appendChild(tSpan);
  const x = document.createElement("button");
  x.className = "m-x";
  x.setAttribute("aria-label", "关闭");
  x.appendChild(icon("x"));
  x.addEventListener("click", () => {
    if (typeof onX === "function") onX(close);
    else close();
  });
  head.appendChild(t); head.appendChild(x);

  const mBody = document.createElement("div");
  mBody.className = "m-body";
  if (typeof body === "string") mBody.innerHTML = body;
  else if (body) mBody.appendChild(body);

  m.appendChild(head); m.appendChild(mBody);
  if (foot) { const mf = document.createElement("div"); mf.className = "m-foot"; while (foot.firstChild) mf.appendChild(foot.firstChild); m.appendChild(mf); }
  back.appendChild(m);
  root.appendChild(back);

  let closed = false;
  function close(){
    if (closed) return;
    closed = true;
    const i = modalStack.indexOf(handle);
    if (i >= 0) modalStack.splice(i, 1);
    back.classList.add("out");
    back.style.transition = "opacity .18s";
    back.style.opacity = "0";
    setTimeout(() => back.remove(), 190);
    if (typeof opts.onClose === "function") opts.onClose();
    requestAnimationFrame(() => focusTopModal());
  }
  const handle = { close, body: mBody, el: m, back };
  modalStack.push(handle);
  // 空白处点击不关闭（防误触）；仅 X 或确认按钮可关闭
  back.addEventListener("pointerdown", e => { if (e.target === back) e.stopPropagation(); });
  // 自动聚焦首个输入
  requestAnimationFrame(() => {
    const inp = mBody.querySelector("input,textarea,select");
    if (inp) inp.focus();
  });
  return handle;
}
function focusTopModal(){
  if (!modalStack.length) return;
  const top = modalStack[modalStack.length - 1];
  const inp = top.el.querySelector("input,textarea,select");
  if (inp && !REDUCED) try { inp.focus({ preventScroll: true }); } catch (e) {}
}
function confirmDialog(opts){
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    const foot = document.createElement("div");
    const cancel = document.createElement("button");
    cancel.className = "btn ghost";
    cancel.textContent = opts.cancelText || "取消";
    cancel.addEventListener("click", () => handle.close());
    const ok = document.createElement("button");
    ok.className = "btn " + (opts.danger ? "danger" : "primary");
    ok.textContent = opts.confirmText || "确认";
    ok.addEventListener("click", () => { handle.close(); finish(true); });
    foot.appendChild(cancel); foot.appendChild(ok);
    const body = document.createElement("div");
    body.style.padding = "4px 2px";
    const p = document.createElement("p");
    p.style.fontSize = "13.5px"; p.style.lineHeight = "1.7"; p.style.fontWeight = "600";
    p.textContent = opts.message || "确定要执行这个操作吗？";
    body.appendChild(p);
    const handle = openModal({
      title: opts.title || "提示",
      iconName: opts.iconName || (opts.danger ? "warning" : "sparkle"),
      body, foot, sm: true,
      onX: () => { handle.close(); finish(false); }
    });
  });
}

/* ---------------- 右键菜单 ---------------- */
let ctxOpen = false;
function showMenu(x, y, items){
  hideMenu();
  const root = $("#menuRoot");
  const menu = document.createElement("div");
  menu.className = "ctx";
  const head = items.head ? document.createElement("div") : null;
  if (head) { head.className = "ctx-head"; head.textContent = items.head; menu.appendChild(head); }
  (items.items || []).forEach((it, i) => {
    if (it === "-") { const sep = document.createElement("div"); sep.className = "ctx-sep"; menu.appendChild(sep); return; }
    const row = document.createElement("button");
    row.className = "ctx-item" + (it.danger ? " danger" : "");
    if (it.icon) row.appendChild(icon(it.icon));
    const s = document.createElement("span");
    s.textContent = it.label;
    row.appendChild(s);
    row.addEventListener("click", e => {
      e.stopPropagation();
      hideMenu();
      if (typeof it.onClick === "function") it.onClick();
    });
    row.addEventListener("pointerdown", e => e.stopPropagation());
    menu.appendChild(row);
  });
  root.appendChild(menu);
  // 边界裁剪
  const r = menu.getBoundingClientRect();
  const vw = innerWidth, vh = innerHeight;
  menu.style.left = clamp(x, 6, Math.max(6, vw - r.width - 6)) + "px";
  menu.style.top  = clamp(y, 6, Math.max(6, vh - r.height - 6)) + "px";
  ctxOpen = true;
  // 延迟绑定外部点击关闭
  setTimeout(() => document.addEventListener("pointerdown", onCtxOut, { once: true }), 0);
}
function onCtxOut(e){
  if (!ctxOpen) return;
  const menu = $("#menuRoot .ctx");
  if (menu && menu.contains(e.target)) return;
  hideMenu();
}
function hideMenu(){
  const root = $("#menuRoot");
  root.innerHTML = "";
  ctxOpen = false;
}

function themeSwatchValues(id){
  const probe = document.createElement("div");
  probe.setAttribute("data-theme", id);
  document.body.appendChild(probe);
  const s = getComputedStyle(probe);
  const v = {};
  themeVars.forEach(k => v[k] = s.getPropertyValue("--" + k).trim());
  probe.remove();
  return v;
}
function applyTheme(id){
  const t = THEMES.find(x => x.id === id);

/* ---------------- 搜索动作与记录 ---------------- */
function doSearch(q){
  q = String(q || "").trim();
  if (!q) {
    const inp = $("#searchInput");
    inp.focus();
    inp.style.animation = "none"; void inp.offsetWidth;
    inp.style.animation = "shakeX .4s";
    toast("先输入想搜索的内容吧", "warn", "search");
    return;
  }
  const e = currentEngine();
  let url = e.url;
  if (url.indexOf("{query}") >= 0) url = url.split("{query}").join(encodeURIComponent(q));
  else url = url + (url.indexOf("?") >= 0 ? "&" : "?") + "q=" + encodeURIComponent(q);
  window.open(url, "_blank", "noopener");
  updateHistory(q);
  mascot("happy");
  statInc("searches");
}
function updateHistory(q){
  if (!state.historyEnabled) return;
  let h = state.searchHistory.filter(x => x !== q);
  h.unshift(q);
  state.searchHistory = h.slice(0, state.historyCount);
  saveState();
  renderHistoryDropdown();
}
function renderHistoryDropdown(){
  const list = $("#historyList");
  const clearBtn = $("#historyClear");
  list.innerHTML = "";
  const items = state.historyEnabled ? state.searchHistory : [];
  if (!items.length) {
    const empty = document.createElement("div");
    empty.className = "drop-empty";
    empty.appendChild(icon("moon"));
    const p = document.createElement("span");
    p.textContent = state.historyEnabled ? "还没有搜索记录" : "搜索记录已关闭，可在设置中开启";
    empty.appendChild(p);
    list.appendChild(empty);
    clearBtn.hidden = true;
    return;
  }
  items.forEach(q => {
    const row = document.createElement("div");
    row.className = "hitem";
    row.appendChild(icon("clock", "h-ico"));
    const qs = document.createElement("span");
    qs.className = "h-q";
    qs.textContent = q;
    row.appendChild(qs);
    const del = document.createElement("button");
    del.className = "h-del";
    del.setAttribute("aria-label", "删除该条记录");
    del.appendChild(icon("x"));
    del.addEventListener("click", ev => {
      ev.stopPropagation();
      state.searchHistory = state.searchHistory.filter(x => x !== q);
      saveState();
      renderHistoryDropdown();
    });
    row.appendChild(del);
    row.addEventListener("click", ev => {
      if (ev.target.closest(".h-del")) return;
      $("#searchInput").value = q;
      doSearch(q);
    });
    list.appendChild(row);
  });
  clearBtn.hidden = false;
  clearBtn.onclick = () => {
    state.searchHistory = [];
    saveState();
    renderHistoryDropdown();
    toast("已清空全部搜索记录", "ok", "check");
  };
}
function openDrop(which){
  if (which === "history") {
    if (!state.historyEnabled) return;
    resetHistNav();
    renderHistoryDropdown();
    $("#historyDropdown").hidden = false;
    $("#engineDropdown").hidden = true;
    $("#engineChip").classList.remove("open");
  } else {
    resetHistNav();
    renderEngineDropdown();
    $("#engineDropdown").hidden = false;
    $("#historyDropdown").hidden = true;
    $("#engineChip").classList.add("open");
  }
}
function closeDrop(which){
  if (which !== "history") { $("#engineDropdown").hidden = true; $("#engineChip").classList.remove("open"); }
  if (which !== "engine") { $("#historyDropdown").hidden = true; resetHistNav(); }
}
function closeAllDrops(){
  closeDrop("both");
}

/* ---------------- 搜索框交互 ---------------- */
function bindSearch(){
  const inp = $("#searchInput");
  const chip = $("#engineChip");
  inp.addEventListener("focus", () => openDrop("history"));
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      const rows = $$("#historyList .hitem");
      if (histIdx >= 0 && rows[histIdx]) {
        const q = rows[histIdx].querySelector(".h-q");
        doSearch(q ? q.textContent : inp.value);
        resetHistNav();
      } else {
        doSearch(inp.value);
      }
    }
    if (e.key === "Escape") { closeAllDrops(); resetHistNav(); }
    if (e.key === "ArrowDown" && !$("#historyDropdown").hidden) { e.preventDefault(); histNav(1); }
    if (e.key === "ArrowUp" && !$("#historyDropdown").hidden) { e.preventDefault(); histNav(-1); }
  });
  chip.addEventListener("click", e => {
    e.stopPropagation();
    if ($("#engineDropdown").hidden) { closeDrop("engine"); openDrop("engine"); }
    else closeDrop("engine");
  });
  $("#searchBtn").addEventListener("click", () => doSearch(inp.value));
  $("#engineAddBtn").addEventListener("click", () => { closeDrop("engine"); openEngineAddModal(); });
  $("#engineManageBtn").addEventListener("click", () => { closeDrop("engine"); openEngineManageModal(); });
}

<script>
/* ============================================================
   快捷方式：网格渲染 / 双层子链接 / 拖拽排序 / 卡片菜单
   ============================================================ */
const GAP = 14;
let gridCols = 8;
let cardNodes = {};
let dragState = null;

function computeCols(){
  const w = innerWidth;
  const base = parseInt(getComputedStyle(document.body).getPropertyValue("--layout-cols")) || 8;
  if (w < 600) gridCols = Math.min(base, 4);
  else if (w < 900) gridCols = Math.min(base, 6);
  else gridCols = base;
  return gridCols;
}
function applyGridVars(){
  const grid = $("#grid");
  if (!grid) return;
  computeCols();
  const rect = grid.getBoundingClientRect();
  const cell = Math.max(64, (rect.width - (gridCols - 1) * GAP) / gridCols);
  grid.style.setProperty("--cols", gridCols);
  grid.style.setProperty("--cell", cell + "px");
}
function normalizeUrl(u){
  u = String(u || "").trim();
  if (!u) return null;
  /* 带 :// 的才是真正协议（http:// steam:// ftp:// 等） */
  if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(u)) {
    try { return new URL(u).href; } catch (e) { return null; }
  }
  /* 其余情况一律补 https://（www.xxx、xxx.com、IP、localhost:3000 都兼容） */
  try { return new URL("https://" + u).href; }
  catch (e) { return null; }
}
function domainOf(url){
  try { return new URL(normalizeUrl(url) || url).hostname.replace(/^www\./, ""); }
  catch (e) { return ""; }
}
function iconForDomain(host){
  const h = String(host || "").toLowerCase();
  if (h.includes("baidu")) return "paw";
  if (h.includes("douyin") || h.includes("tiktok")) return "music";
  if (h.includes("bilibili") || h.includes("b23")) return "tv";
  if (h.includes("steam")) return "game";
  if (h.includes("github") || h.includes("gitee") || h.includes("gitlab")) return "code";
  if (h.includes("zhihu")) return "book";
  if (h.includes("taobao") || h.includes("tmall") || h.includes("jd.com")) return "cart";
  if (h.includes("weibo")) return "chat";
  if (h.includes("youku") || h.includes("iqiyi") || h.includes("youtube") || h.includes("qq.com")) return "camera";
  if (h.includes("mail") || h.includes("gmail") || h.includes("outlook")) return "mail";
  if (h.includes("google")) return "sun";
  if (h.includes("bing")) return "globe";
  return "globe";
}
function shortcutById(id){ return state.shortcuts.find(s => s.id === id); }
function openUrl(u){
  u = normalizeUrl(u);
  if (!u) { toast("网址格式不正确", "err", "warning"); return; }
  window.open(u, "_blank", "noopener");
}

/* 布局模拟：与 CSS grid-auto-flow:row 的非密集自动排布保持一致 */
function simulateLayout(items, cols){
  const pos = [];
  let row = 0, col = 0;
  for (const it of items) {
    const cw = clamp(Math.max(1, it.cw | 0), 1, cols);
    const ch = Math.max(1, it.ch | 0);
    if (col + cw > cols) { row++; col = 0; }
    pos.push({ id: it.id, r: row, c: col, cw, ch });
    col += cw;
    if (col >= cols) { row++; col = 0; }
  }
  const rows = pos.reduce((m, p) => Math.max(m, p.r + p.ch), 0);
  return { pos, rows };
}

/* 卡片内容层填充 */
function childName(sc, child){ return (child && child.name && child.name.trim()) ? child.name.trim() : (domainOf(child && child.url) || sc.name || "链接"); }
function childHost(sc, child){ return domainOf(child && child.url); }
function fillCardLayer(el, sc, child){
  el.innerHTML = "";
  const ico = document.createElement("div");
  ico.className = "card-ico";
  ico.appendChild(icon(child ? (child.icon || iconForDomain(child.url)) : (sc.icon || iconForDomain(sc.url)), null));
  const name = document.createElement("div");
  name.className = "card-name";
  name.textContent = sc.name;
  const host = document.createElement("div");
  host.className = "card-host";
  host.textContent = child ? childHost(sc, child) : domainOf(sc.url);
  el.appendChild(ico); el.appendChild(name); el.appendChild(host);
}

/* 子链接切换动画 */
function switchChild(sc, dir){
  if (!sc.children || !sc.children.length) return;
  const n = sc.children.length + 1; /* 主链接 + 子链接 */
  if (sc.cur == null) sc.cur = 0;
  sc.cur = (sc.cur + dir + n) % n;
  saveState();
  const card = cardNodes[sc.id];
  if (!card) return;
  const front = $(".card-front", card), back = $(".card-back", card);
  if (!front) return;
  const child = sc.cur === 0 ? null : sc.children[sc.cur - 1];
  front.classList.add(dir > 0 ? "sw-l" : "sw-r");
  setTimeout(() => {
    fillCardLayer(front, sc, child);
    fillCardLayer(back, sc, child);
    front.classList.remove("sw-l", "sw-r");
    front.classList.add(dir > 0 ? "in-r" : "in-l");
    setTimeout(() => front.classList.remove("in-r", "in-l"), 340);
  }, 150);
}

/* 卡片 DOM */
function buildCard(sc){
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.id = sc.id;
  const shell = document.createElement("div");
  shell.className = "card-shell";
  const stack = document.createElement("div");
  stack.className = "card-stack";
  const back = document.createElement("div");
  back.className = "card-back";
  const front = document.createElement("div");
  front.className = "card-front";
  stack.appendChild(back); stack.appendChild(front);
  shell.appendChild(stack);
  const more = document.createElement("button");
  more.className = "card-more";
  more.setAttribute("aria-label", "更多操作");
  more.appendChild(icon("dots"));
  const tip = document.createElement("div");
  tip.className = "card-tip";
  const resize = document.createElement("div");
  resize.className = "card-resize";
  resize.setAttribute("title", "拖动调整大小");
  card.appendChild(shell); card.appendChild(more); card.appendChild(tip); card.appendChild(resize);
  updateCardNode(card, sc);
  bindCard(card, sc);
  return card;
}
function updateCardNode(card, sc){
  card.style.setProperty("--cw", sc.cw);
  card.style.setProperty("--ch", sc.ch);
  card.dataset.cw = sc.cw;
  card.dataset.ch = sc.ch;
  const has = sc.children && sc.children.length > 0;
  card.classList.toggle("has-children", has);
  const front = $(".card-front", card), back = $(".card-back", card);
  const child = (has && sc.cur > 0) ? sc.children[sc.cur - 1] : null;
  fillCardLayer(front, sc, child);
  fillCardLayer(back, sc, child);
  const tip = $(".card-tip", card);
  if (tip) tip.textContent = has ? "滚轮 / 拖动切换 · 主链接 + " + sc.children.length + " 个子链接" : "";
  card.classList.toggle("touch", IS_COARSE);
  if (cardNodes[sc.id]) refreshCardTitles();
}

/* 卡片交互绑定 */
function bindCard(card, sc){
  card.addEventListener("click", ev => {
    if (ev.target.closest(".card-more")) return;
    if (card.dataset.suppress) { delete card.dataset.suppress; return; }
    const child = (sc.children && sc.children.length && sc.cur > 0) ? sc.children[sc.cur - 1] : null;
    openUrl(child ? child.url : sc.url);
  });
  card.addEventListener("contextmenu", ev => {
    ev.preventDefault(); ev.stopPropagation();
    showCardMenu(sc, ev.clientX, ev.clientY);
  });
  moreCardBtn(card, sc);
  /* 滚轮切换子链接（有子链接即可切换：主链接 + 每个子链接） */
  card.addEventListener("wheel", ev => {
    if (!(sc.children && sc.children.length > 0)) return;
    ev.preventDefault();
    switchChild(sc, ev.deltaY > 0 ? 1 : -1);
  }, { passive: false });
  /* 指针：点击 / 滑动切换 / 长按或拖动排序 */
  card.addEventListener("pointerdown", ev => onCardPointerDown(card, sc, ev));
  card.addEventListener("pointermove", ev => onCardPointerMove(card, sc, ev));
  const up = ev => onCardPointerUp(card, sc, ev);
  card.addEventListener("pointerup", up);
  card.addEventListener("pointercancel", up);
  /* 右下角拖拽调整大小 */
  const rh = card.querySelector(".card-resize");
  if (rh) {
    let drag = null;
    rh.addEventListener("pointerdown", ev => {
      if (ev.button !== 0) return;
      ev.preventDefault(); ev.stopPropagation();
      rh.setPointerCapture(ev.pointerId);
      drag = { sx: ev.clientX, sy: ev.clientY, moved: false };
    });
    rh.addEventListener("pointermove", ev => {
      if (!drag) return;
      const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
      if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 15) return;
      drag.moved = true;
      let newCw = sc.cw, newCh = sc.ch;
      if (dx > 20) newCw = 2; else if (dx < -20) newCw = 1;
      if (dy > 20) newCh = 2; else if (dy < -20) newCh = 1;
      if (newCw !== sc.cw || newCh !== sc.ch) {
        sc.cw = newCw; sc.ch = newCh;
        updateCardNode(card, sc);
        saveState();
      }
    });
    const endDrag = ev => {
      if (!drag) return;
      ev.preventDefault(); ev.stopPropagation();
      try { rh.releasePointerCapture(ev.pointerId); } catch(e){}
      drag = null;
    };
    rh.addEventListener("pointerup", endDrag);
    rh.addEventListener("pointercancel", endDrag);
    rh.addEventListener("click", ev => { ev.stopPropagation(); ev.preventDefault(); });
  }

/* 指针拖拽控制器 */
function onCardPointerDown(card, sc, ev){
  if (ev.button !== 0) return;
  if (ev.target.closest(".card-more")) return;
  if (dragState && dragState.id !== sc.id) endReorder();
  dragState = {
    id: sc.id, mode: "pending", x: ev.clientX, y: ev.clientY, sx: ev.clientX, sy: ev.clientY, t: Date.now(),
    startX: ev.clientX, suppress: false, timer: null
  };
  try { card.setPointerCapture(ev.pointerId); } catch (e) {}
  dragState.timer = setTimeout(() => {
    if (dragState && dragState.id === sc.id && dragState.mode === "pending") {
      dragState.mode = "reorder";
      dragState.suppress = true;
      armReorder(sc, { clientX: dragState.x, clientY: dragState.y });
    }
  }, 620);
}
function onCardPointerMove(card, sc, ev){
  const d = dragState;
  if (!d || d.id !== sc.id || d.mode === "done") return;
  d.x = ev.clientX; d.y = ev.clientY;
  const hasKids = sc.children && sc.children.length > 0;
  if (d.mode === "pending") {
    const mx = ev.clientX - d.sx, my = ev.clientY - d.sy;
    const dt = Date.now() - d.t;
    if (hasKids) {
      if (Math.abs(mx) > 26 && Math.abs(mx) > Math.abs(my) * 1.15 && dt < 650) {
        d.mode = "swipe"; d.suppress = true; d.startX = d.sx;
      } else if (dt > 600 || Math.abs(my) > 26) {
        d.mode = "reorder"; d.suppress = true;
        armReorder(sc, ev);
      }
    } else {
      if (Math.abs(mx) > 8 || Math.abs(my) > 8) {
        d.mode = "reorder"; d.suppress = true;
        armReorder(sc, ev);
      }
    }
  }
  if (d.mode === "swipe" && hasKids) {
    const sdx = ev.clientX - d.startX;
    if (Math.abs(sdx) > 40) {
      switchChild(sc, sdx < 0 ? 1 : -1);
      d.startX = ev.clientX;
    }
  }
  if (d.mode === "reorder") moveReorder(ev);
}
function onCardPointerUp(card, sc, ev){
  const d = dragState;
  if (!d || d.id !== sc.id) return;
  if (d.timer) clearTimeout(d.timer);
  if (d.mode === "reorder") endReorder();
  if (d.suppress) card.dataset.suppress = "1";
  dragState = null;
}
function armReorder(sc, ev){
  if (dragState && dragState.ghost) return;
  const card = cardNodes[sc.id];
  if (!card) return;
  card.classList.add("dragging");
  $("#grid").classList.add("dragging");
  dragState.ghost = card;
  dragState.startRect = card.getBoundingClientRect();
  dragState.lastIdx = -1;
  dragState.lastX = ev.clientX;
  dragState.overId = null;
  /* 创建占位符，留在原位显示虚线框 */
  const ph = document.createElement("div");
  ph.className = "drop-placeholder";
  ph.dataset.w = sc.w || 1;
  ph.dataset.h = sc.h || 1;
  card.parentNode.insertBefore(ph, card.nextSibling);
  dragState.ph = ph;
  card.style.position = "fixed";
  card.style.zIndex = "1000";
  card.style.margin = "0";
  updateGhost(ev);
  /* 窗口失焦时强制结束拖拽，防止占位符残留 */
  window.addEventListener("blur", endReorder);
}
function updateGhost(ev){
  const g = dragState && dragState.ghost;
  if (!g || !dragState.startRect) return;
  const r = dragState.startRect;
  g.style.left = (ev.clientX - r.width / 2) + "px";
  g.style.top = (ev.clientY - r.height / 2) + "px";
  g.style.width = r.width + "px";
  g.style.height = r.height + "px";
}
function moveReorder(ev){
  if (!dragState || !dragState.ghost) return;
  updateGhost(ev);
  const dragId = dragState.id;
  const dx = ev.clientX - (dragState.lastX || ev.clientX);
  dragState.lastX = ev.clientX;
  for (let i = 0; i < state.shortcuts.length; i++) {
    const s = state.shortcuts[i];
    if (s.id === dragId) continue;
    const n = cardNodes[s.id];
    if (!n) continue;
    const r = n.getBoundingClientRect();
    if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
      /* 目标位置：向右拖放在卡片后，向左拖放在卡片前 */
      const targetIdx = dx >= 0 ? i + 1 : i;
      const dragArrIdx = state.shortcuts.findIndex(x => x.id === dragId);
      if (dragArrIdx === targetIdx) return;
      /* 记录位置做动画 */
      const before = {};
      state.shortcuts.forEach(x => {
        if (x.id === dragId) return;
        const nd = cardNodes[x.id];
        if (nd) { const br = nd.getBoundingClientRect(); before[x.id] = {l: br.left, t: br.top}; }
      });
      const [item] = state.shortcuts.splice(dragArrIdx, 1);
      let insertPos = state.shortcuts.findIndex(x => x.id === s.id);
      if (dx >= 0) insertPos += 1;
      state.shortcuts.splice(insertPos, 0, item);
      if (dragState.ph) {
        const refNode = cardNodes[state.shortcuts[insertPos - 1] && state.shortcuts[insertPos - 1].id !== dragId ? state.shortcuts[insertPos - 1].id : s.id];
        if (dx >= 0) {
          if (refNode && refNode.nextSibling) refNode.parentNode.insertBefore(dragState.ph, refNode.nextSibling);
          else if (refNode) refNode.parentNode.appendChild(dragState.ph);
        } else {
          n.parentNode.insertBefore(dragState.ph, n);
        }
      }
      requestAnimationFrame(() => {
        state.shortcuts.forEach(x => {
          if (x.id === dragId || !before[x.id]) return;
          const nd = cardNodes[x.id];
          const now = nd.getBoundingClientRect();
          const ddx = before[x.id].l - now.left, ddy = before[x.id].t - now.top;
          if (ddx || ddy) {
            nd.style.transition = "none";
            nd.style.transform = "translate(" + ddx + "px," + ddy + "px)";
            void nd.offsetWidth;
            nd.style.transition = "transform .28s cubic-bezier(.22,.8,.3,1)";
            nd.style.transform = "";
          }
        });
      });
      return;
    }
  }
}
function rebuildOverlay(){}
function endReorder(){
  if (!dragState) return;
  window.removeEventListener("blur", endReorder);
  const card = cardNodes[dragState.id];
  if (card) {
    card.classList.remove("dragging");
    card.style.position = "";
    card.style.zIndex = "";
    card.style.margin = "";
    card.style.left = "";
    card.style.top = "";
    card.style.width = "";
    card.style.height = "";
    /* 把卡片移到占位符的位置，让它落在正确的网格格子里 */
    if (dragState.ph && dragState.ph.parentNode) {

}
function applyOrder(animate){

        const n = cardNodes[s.id];

        const r = n.getBoundingClientRect();
        const dx = first[s.id].l - r.left, dy = first[s.id].t - r.top;
        if (dx || dy) {
          n.style.transition = "none";

          void n.offsetWidth;
          n.style.transition = "transform .38s cubic-bezier(.22,.8,.3,1)";

}

/* ---------------- 恢复默认引擎 ---------------- */
function restoreDefaultEngines(){
  let added = 0;
  DEFAULT_ENGINES.forEach(de => {
    if (!engineById(de.id)) {
      state.engines.push({ ...de });
      added++;
    }
  });
  if (state.lastEngineId === "baidu" || !engineById(state.lastEngineId)) {
    const b = engineById("baidu");
    if (b && !b.enabled) b.enabled = true;
    state.lastEngineId = "baidu";
  }
  saveState();
  renderEngineDropdown(); renderEngineChip();
  toast(added ? "已恢复 " + added + " 个默认搜索引擎" : "默认搜索引擎已齐全，无需恢复", "ok", "refresh");
}

      row.addEventListener("contextmenu", ev => {
        ev.preventDefault(); ev.stopPropagation();
        const items = [
          { label: e.enabled ? "停用" : "启用", icon: e.enabled ? "eye-off" : "eye", onClick: () => { e.enabled = !e.enabled; saveState(); refresh(); renderEngineDropdown(); renderEngineChip(); } },
          { label: "删除", icon: "trash", danger: true, onClick: async () => {
            const yes = await confirmDialog({ title: "删除搜索引擎", iconName: "trash", danger: true, message: "确定删除「" + e.name + "」吗？" });
            if (!yes) return;
            state.engines = state.engines.filter(x => x.id !== e.id);

    /* 底部操作条 */
    footAct.style.display = mode ? "inline-flex" : "none";
    if (mode) {

      footAct.textContent = labels[mode] + "（" + sel.size + "）";

      footAct.onclick = () => {
        const ids = [...sel];

          ? confirmDialog({ title: "批量删除", iconName: "trash", danger: true, message: "确定删除选中的 " + ids.length + " 个搜索引擎吗？", confirmText: "确认删除" })

function downloadBatchTemplate(){
  try {
    const bin = buildTemplateXlsx();
    const blob = new Blob([bin], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    downloadBlob("搜索引擎批量导入模板.xlsx", blob);
    toast("模板已下载，请用 Excel 或 WPS 打开填写", "ok", "download");
  } catch (e) {
    toast("模板生成失败：" + e.message, "err", "warning");
  }
}
function handleBatchFile(file){
  const isXlsx = /\.xlsx?$/i.test(file.name);
  const isCsv = /\.csv$/i.test(file.name);
  if (!isXlsx && !isCsv) { toast("仅支持 .xlsx 或 .csv 文件", "err", "warning"); return; }
  parseSpreadsheet(file).then(rows => {
    const r = importEngineRows(rows);
    toast("导入完成：新增 " + r.added + " 个，覆盖 " + r.updated + " 个" + (r.skipped ? "，跳过 " + r.skipped + " 条" : ""), "ok", "check");
    renderEngineDropdown(); renderEngineChip();
  }).catch(err => {
    if (err && err.needSheetJS) {
      toast("该 Excel 使用了压缩格式，正在尝试联网解析…", "warn", "upload");
      loadSheetJS().then(XLSX => {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const wb = XLSX.read(reader.result, { type: "array" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
            const r = importEngineRows(rows);
            toast("导入完成：新增 " + r.added + " 个，覆盖 " + r.updated + " 个" + (r.skipped ? "，跳过 " + r.skipped + " 条" : ""), "ok", "check");
            renderEngineDropdown(); renderEngineChip();
          } catch (e2) { toast("解析 Excel 失败：" + e2.message, "err", "warning"); }
        };
        reader.readAsArrayBuffer(file);

function unzipStore(buf){

    const csize = dv.getUint32(o + 18, true);
    const nlen = dv.getUint16(o + 26, true);
    const elen = dv.getUint16(o + 28, true);
    const name = new TextDecoder().decode(new Uint8Array(buf, o + 30, nlen));

function parseSpreadsheet(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        if (/\.csv$/i.test(file.name)) {
          const text = new TextDecoder().decode(reader.result);
          resolve(normalizeRows(parseCSV(text)));
          return;
        }
        const entries = unzipStore(reader.result);
        const sheet = entries["xl/worksheets/sheet1.xml"];
        if (!sheet) { reject(new Error("未找到工作表")); return; }
        let shared = [];
        const ss = entries["xl/sharedStrings.xml"];
        if (ss && ss.data) {
          const sx = new TextDecoder().decode(ss.data);
          shared = Array.from(sx.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g), m => xmlUnescape(m[1]));
        }
        const xml = new TextDecoder().decode(sheet.data);
        const rows = [];
        const rowRe = /<row\b[^>]*>([\s\S]*?)<\/row>/g;
        let m;
        while ((m = rowRe.exec(xml))) {
          const cells = [];
          const cRe = /<c\b[^>]*>([\s\S]*?)<\/c>|<c\b[^>]*\/>/g;
          let cm;
          while ((cm = cRe.exec(m[1]))) {
            const head = cm[0].slice(0, cm[0].indexOf(">") + 1);
            const t = (head.match(/t="([^"]*)"/) || [])[1];
            const inner = cm[1] || "";
            let val = "";
            if (t === "s") {
              const v = (inner.match(/<v>([\s\S]*?)<\/v>/) || [])[1];
              const idx = parseInt(v, 10);
              val = shared[idx] != null ? shared[idx] : "";
            } else if (t === "inlineStr" || inner.indexOf("<t") >= 0) {
              const t2 = (inner.match(/<t[^>]*>([\s\S]*?)<\/t>/) || [])[1];
              val = t2 != null ? xmlUnescape(t2) : "";
            } else {
              const v = (inner.match(/<v>([\s\S]*?)<\/v>/) || [])[1];
              val = v != null ? xmlUnescape(v) : "";
            }
            cells.push(val);
          }
          if (cells.some(x => String(x).trim())) rows.push(cells);
        }
        resolve(normalizeRows(rows));
      } catch (e) {
        const err = e && e.needSheetJS ? e : new Error("文件解析失败");
        if (e && e.needSheetJS) { err.needSheetJS = true; }
        reject(err);
      }
    };
    reader.onerror = () => reject(new Error("读取文件失败"));
    reader.readAsArrayBuffer(file);
  });
}
function parseCSV(text){
  const rows = [];
  let cur = "", row = [], q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); cur = "";
      if (row.some(x => String(x).trim())) rows.push(row);
      row = [];
    } else cur += ch;
  }
  row.push(cur);
  if (row.some(x => String(x).trim())) rows.push(row);
  return rows;
}
function normalizeRows(rows){
  if (!rows.length) return [];
  const first = rows[0].map(x => String(x || "").trim());
  if (/名称|name/i.test(first[0] || "") && /地址|url|query|占位/i.test(first[1] || "")) rows.shift();
  return rows;
}

function fmtTime(ts){

  bubble.appendChild(txt);

    ev.preventDefault(); ev.stopPropagation();
    showMsgMenu(turn, ev.clientX, ev.clientY);
  });

    if (ev.pointerType === "touch") lp = setTimeout(() => showMsgMenu(turn, ev.clientX, ev.clientY), 500);

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast("已复制", "ok", "copy"))
      .catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); toast("已复制", "ok", "copy"); } catch (e) { toast("复制失败", "err", "warning"); }
  ta.remove();
}
function deleteTurns(ids){
  const idSet = new Set(ids);
  if (chatBusy && chatAbort) {
    const last = state.chats[state.chats.length - 1];
    if (last && idSet.has(last.id) && !last.ai) { try { chatAbort.abort(); } catch (e) {} }
  }
  state.chats = state.chats.filter(t => !idSet.has(t.id));
  saveState();
  selChat.clear();
  $("#chatPanel").classList.remove("multi");
  renderChat();
  toast(ids.length > 1 ? "已删除 " + ids.length + " 条对话" : "已删除该条对话", "ok", "trash");
}

function chatContext(){
  return state.chats.slice(-MAX_CHAT).flatMap(t => {
    const arr = [{ role: "user", content: t.user.content }];
    if (t.ai && t.ai.content) arr.push({ role: "assistant", content: t.ai.content });
    return arr;
  }).slice(-50);
}

    inp.value = v.slice(0, MAX_QUERY);

  }
  const c = $("#chatChar");
